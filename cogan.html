<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dragon Spin & Aksara Keberuntungan</title>
    <style>
        :root {
            --primary: #dc2626; /* Merah oriental */
            --primary-hover: #b91c1c;
            --accent: #fbbf24; /* Emas */
            --scatter: #ec4899;
            --bg-dark: #180505;
            --card-bg: #260808;
            --text-light: #fef3c7;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-light);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background-image: radial-gradient(circle, #3d0a0a 0%, #180505 100%);
        }

        .container {
            background-color: var(--card-bg);
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(251, 191, 36, 0.2);
            padding: 30px;
            max-width: 480px;
            width: 100%;
            text-align: center;
            border: 2px solid var(--accent);
        }

        h1 {
            font-size: 1.8rem;
            margin-bottom: 5px;
            color: var(--accent);
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }

        .dragon-title {
            font-size: 1.2rem;
            color: #f87171;
            margin-bottom: 15px;
            letter-spacing: 2px;
        }

        .subtitle {
            font-size: 0.85rem;
            color: #d1d5db;
            margin-bottom: 20px;
        }

        .stats-box {
            display: flex;
            justify-content: space-around;
            background: #110202;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 25px;
            border: 1px solid #7f1d1d;
        }

        .stat-item span {
            display: block;
        }

        .stat-label {
            font-size: 0.8rem;
            color: #9ca3af;
        }

        .stat-value {
            font-size: 1.2rem;
            font-weight: bold;
            color: var(--accent);
        }

        .wheel-container {
            position: relative;
            width: 310px;
            height: 310px;
            margin: 0 auto 25px auto;
        }

        .pointer {
            position: absolute;
            top: -15px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 15px solid transparent;
            border-right: 15px solid transparent;
            border-top: 30px solid var(--accent);
            z-index: 10;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.8));
        }

        canvas {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            box-shadow: 0 0 20px rgba(251, 191, 36, 0.4);
            border: 5px solid var(--accent);
        }

        .btn {
            background-color: var(--primary);
            color: var(--text-light);
            border: 2px solid var(--accent);
            padding: 12px 30px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            width: 100%;
            box-shadow: 0 4px 15px rgba(220, 38, 38, 0.4);
        }

        .btn:hover:not(:disabled) {
            background-color: var(--primary-hover);
            transform: translateY(-2px);
        }

        .btn:active:not(:disabled) {
            transform: scale(0.98);
        }

        .btn:disabled {
            background-color: #4b5563;
            border-color: #6b7280;
            cursor: not-allowed;
            box-shadow: none;
        }

        .message {
            margin-top: 20px;
            font-size: 1rem;
            min-height: 30px;
            font-weight: 500;
        }

        .scatter-alert {
            background: rgba(236, 72, 153, 0.2);
            border: 1px solid var(--scatter);
            color: #f472b6;
            padding: 10px;
            border-radius: 8px;
            margin-top: 15px;
            font-weight: bold;
            animation: pulse 1.5s infinite;
            display: none;
        }

        @keyframes pulse {
            0% { opacity: 0.8; }
            50% { opacity: 1; transform: scale(1.02); }
            100% { opacity: 0.8; }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>🐉 DRAGON SPIN 🐉</h1>
        <div class="dragon-title">龍之转盘 (Aksara Keberuntungan)</div>
        <p class="subtitle">Simulasi Hiburan Interaktif</p>

        <div class="stats-box">
            <div class="stat-item">
                <span class="stat-label">Koin Naga</span>
                <span id="coinCount" class="stat-value">1000</span>
            </div>
            <div class="stat-item">
                <span class="stat-label">Scatter (龙 Free Spin)</span>
                <span id="scatterCount" class="stat-value" style="color: var(--scatter);">0</span>
            </div>
        </div>

        <div class="wheel-container">
            <div class="pointer"></div>
            <canvas id="wheelCanvas" width="310" height="310"></canvas>
        </div>

        <button id="spinBtn" class="btn" onclick="startSpin()">PUTAR NAGA (100 Koin)</button>

        <div id="scatterAlert" class="scatter-alert">🐲 SCATTER NAGA AKTIF! Free Spin Didapatkan! 🐲</div>
        <div id="message" class="message">Tekan tombol putar untuk memanggil keberuntungan naga!</div>
    </div>

    <script>
        const canvas = document.getElementById('wheelCanvas');
        const ctx = canvas.getContext('2d');
        const spinBtn = document.getElementById('spinBtn');
        const coinCountEl = document.getElementById('coinCount');
        const scatterCountEl = document.getElementById('scatterCount');
        const messageEl = document.getElementById('message');
        const scatterAlert = document.getElementById('scatterAlert');

        // Data Sektor Roda menggunakan Aksara Tiongkok & Simbol Naga
        const sectors = [
            { label: "福 (Fú - Berkah)", value: 150, type: "coin", color: "#b91c1c" },
            { label: "吉 (Jí - Untung)", value: 75, type: "coin", color: "#7f1d1d" },
            { label: "龙 (Lóng - Naga)", value: 500, type: "coin", color: "#b45309" },
            { label: "🐉 Scatter!", value: 3, type: "scatter", color: "#db2777" },
            { label: "财 (Cái - Kekayaan)", value: 300, type: "coin", color: "#d97706" },
            { label: "空 (Kōng - Kosong)", value: 0, type: "miss", color: "#4b5563" },
            { label: "金 (Jīn - Emas)", value: 200, type: "coin", color: "#92400e" },
            { label: "安 (Ān - Damai)", value: 50, type: "coin", color: "#991b1b" }
        ];

        const totalSectors = sectors.length;
        const arcSize = (2 * Math.PI) / totalSectors;
        
        let currentAngle = 0;
        let isSpinning = false;
        let coins = 1000;
        let freeSpins = 0;
        let costPerSpin = 100;

        function drawWheel() {
            const radius = canvas.width / 2;
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            sectors.forEach((sector, index) => {
                const angle = currentAngle + index * arcSize;

                // Gambar latar potongan pie
                ctx.beginPath();
                ctx.fillStyle = sector.color;
                ctx.moveTo(radius, radius);
                ctx.arc(radius, radius, radius, angle, angle + arcSize);
                ctx.lineTo(radius, radius);
                ctx.fill();
                ctx.lineWidth = 1.5;
                ctx.strokeStyle = "#fbbf24";
                ctx.stroke();

                // Tulis teks aksara di dalam roda
                ctx.save();
                ctx.translate(radius, radius);
                ctx.rotate(angle + arcSize / 2);
                ctx.textAlign = "right";
                ctx.fillStyle = "#fef3c7";
                ctx.font = "bold 13px sans-serif";
                ctx.fillText(sector.label, radius - 15, 6);
                ctx.restore();
            });
        }

        function updateUI() {
            coinCountEl.innerText = coins;
            scatterCountEl.innerText = freeSpins;
            
            if (freeSpins > 0) {
                spinBtn.innerText = `PUTAR GRATIS NAGA (${freeSpins} tersisa)`;
                spinBtn.style.backgroundColor = "var(--scatter)";
            } else {
                spinBtn.innerText = `PUTAR NAGA (${costPerSpin} Koin)`;
                spinBtn.style.backgroundColor = "var(--primary)";
            }
        }

        function startSpin() {
            if (isSpinning) return;

            if (freeSpins <= 0 && coins < costPerSpin) {
                messageEl.style.color = "#ef4444";
                messageEl.innerText = "Koin Naga Anda tidak cukup! Refresh halaman untuk mengulang.";
                return;
            }

            if (freeSpins > 0) {
                freeSpins--;
            } else {
                coins -= costPerSpin;
            }

            isSpinning = true;
            spinBtn.disabled = true;
            messageEl.style.color = "var(--text-light)";
            messageEl.innerText = "Naga sedang berputar membawa takdir...";
            scatterAlert.style.display = "none";

            const randomSectorIndex = Math.floor(Math.random() * totalSectors);
            const extraSpins = 5;
            const targetAngle = currentAngle + (2 * Math.PI * extraSpins) + ((totalSectors - randomSectorIndex) * arcSize) - (arcSize / 2);

            let startTime = null;
            const duration = 4000;

            function animateSpin(timestamp) {
                if (!startTime) startTime = timestamp;
                const elapsed = timestamp - startTime;
                const progress = Math.min(elapsed / duration, 1);
                
                const easeOut = 1 - Math.pow(1 - progress, 3);
                
                currentAngle = currentAngle + (targetAngle - currentAngle) * (easeOut > progress ? easeOut : progress);
                drawWheel();

                if (progress < 1) {
                    requestAnimationFrame(animateSpin);
                } else {
                    isSpinning = false;
                    spinBtn.disabled = false;
                    currentAngle = targetAngle % (2 * Math.PI);
                    processResult(randomSectorIndex);
                }
            }

            requestAnimationFrame(animateSpin);
        }

        function processResult(index) {
            const result = sectors[index];
            
            if (result.type === "coin") {
                coins += result.value;
                messageEl.style.color = "#fbbf24";
                messageEl.innerText = `Berkah Naga! Anda mendapatkan ${result.label} (+${result.value} Koin)!`;
            } else if (result.type === "scatter") {
                freeSpins += 3;
                scatterAlert.style.display = "block";
                messageEl.style.color = "var(--scatter)";
                messageEl.innerText = `Pemberkatan Naga Tertinggi! Scatter Terbuka (+3 Putaran Gratis)!`;
            } else {
                messageEl.style.color = "#9ca3af";
                messageEl.innerText = `Aura naga belum berpihak (Kosong). Coba lagi!`;
            }

            updateUI();
        }

        drawWheel();
        updateUI();
    </script>
</body>
</html>
