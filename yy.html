<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>studikasus3</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #f3f4f6;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      background-color: #ffffff;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
      width: 100%;
      max-width: 480px;
      border: 1px solid #e5e7eb;
    }

    h1 {
      font-size: 22px;
      color: #1f2937;
      text-align: center;
      margin-bottom: 6px;
    }

    .subtitle {
      font-size: 13px;
      color: #6b7280;
      text-align: center;
      margin-bottom: 24px;
    }

    .form-group {
      margin-bottom: 16px;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #374151;
      margin-bottom: 6px;
    }

    .row {
      display: flex;
      gap: 12px;
    }

    .row .form-group {
      flex: 1;
    }

    input[type="text"],
    input[type="number"] {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
    }

    input[type="text"]:focus,
    input[type="number"]:focus {
      border-color: #4f46e5;
    }

    .result-box {
      margin-top: 24px;
      background-color: #eef2ff;
      border-radius: 8px;
      padding: 16px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .result-label {
      font-size: 14px;
      font-weight: 600;
      color: #374151;
    }

    .result-value {
      font-size: 18px;
      font-weight: 700;
      color: #4f46e5;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Kalkulator Invoice Sederhana</h1>
    <p class="subtitle">Hitung otomatis total tagihan barang</p>

    <div class="form-group">
      <label for="namaBarang">Nama Barang</label>
      <input type="text" id="namaBarang" placeholder="Contoh: Mouse Wireless">
    </div>

    <div class="row">
      <div class="form-group">
        <label for="hargaBarang">Harga Barang (Rp)</label>
        <input type="number" id="hargaBarang" placeholder="0" min="0">
      </div>
      <div class="form-group">
        <label for="jumlahBeli">Jumlah Beli</label>
        <input type="number" id="jumlahBeli" placeholder="0" min="0">
      </div>
    </div>

    <div class="result-box">
      <span class="result-label">Total Tagihan:</span>
      <span class="result-value" id="totalTagihan">Rp 0</span>
    </div>
  </div>

  <script>
    const hargaBarangInput = document.getElementById('hargaBarang');
    const jumlahBeliInput = document.getElementById('jumlahBeli');
    const totalTagihanDisplay = document.getElementById('totalTagihan');

    function hitungTotal() {
      const harga = parseFloat(hargaBarangInput.value) || 0;
      const jumlah = parseFloat(jumlahBeliInput.value) || 0;
      const total = harga * jumlah;

      totalTagihanDisplay.textContent = 'Rp ' + total.toLocaleString('id-ID');
    }

    hargaBarangInput.addEventListener('input', hitungTotal);
    jumlahBeliInput.addEventListener('input', hitungTotal);
  </script>

</body>
</html>
